<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shikena Tattoo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>

    <!-- ===== BOTÓN WHATSAPP FIJO ===== -->
    <a href="https://wa.me/34657382039" target="_blank" class="whatsapp-float">
        <i class="fab fa-whatsapp"></i>
    </a>

    <!-- ===== HEADER ===== -->
    <header>
        <div class="container header-container">
            <a href="#" class="logo">
                <!-- LOGOS NUEVOS, MÁS GRANDES Y EN LÍNEA -->
                <div class="logo-wrapper">
                    <img src="images/Logo/logolunanegra.png" alt="Shikena Tattoo Luna" class="logo-img">
                    <img src="images/Logo/logoletrasnegras.png" alt="Shikena Tattoo Letras" class="logo-img logo-letras">
                </div>
            </a>
            <div class="header-right">
                <div class="language-selector">
                    <button class="lang-btn active" data-lang="en">EN</button>
                    <span class="lang-divider">|</span>
                    <button class="lang-btn" data-lang="de">DE</button>
                    <span class="lang-divider">|</span>
                    <button class="lang-btn" data-lang="es">ES</button>
                </div>
                <button class="menu-toggle" id="menuToggle" aria-label="Menú">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </div>
        <!-- Menú desplegable -->
        <nav id="mainNav">
            <ul class="nav-menu">
                <li><a href="#galeria" class="nav-link" data-key="nav_galeria">Galería</a></li>
                <li><a href="#videos" class="nav-link" data-key="nav_videos">Videos</a></li>
            </ul>
        </nav>
    </header>

    <!-- ===== PORTADA FIJA (SIN SCROLL) ===== -->
    <section id="inicio" class="hero">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <div class="hero-images">
                <img src="images/Fotos%20tatuador/ChatGPT%20Image%206%20ago%202026%2C%2022_20_57.png" alt="Willy Tordera tatuando" class="hero-img">
                
                <!-- FRASE ELEGANTE (SIN PUNTO) -->
                <div class="hero-quote">
                    <span class="quote-text" data-key="hero_quote">Cada tatuaje<br>cuenta una historia</span>
                </div>
                
                <img src="images/Fotos%20tatuador/ChatGPT%20Image%206%20ago%202026%2C%2022_28_15.png" alt="Willy Tordera con cliente" class="hero-img">
            </div>
            <!-- BOTÓN PARA IR A GALERÍA -->
            <a href="#galeria" class="btn-hero" data-key="hero_btn">Ver galería</a>
        </div>
    </section>

    <!-- ===== GALERÍA ===== -->
    <section id="galeria" class="section gallery">
        <div class="container">
            <h2 class="section-title" data-key="galeria_title">Galería</h2>
            <div class="gallery-tabs">
                <button class="tab-btn active" data-category="blackwork">Blackwork</button>
                <button class="tab-btn" data-category="color">Color</button>
                <button class="tab-btn" data-category="fine-line">Fine Line</button>
                <button class="tab-btn" data-category="cover-ups">Cover Ups</button>
            </div>
            <div class="gallery-grid" id="galleryGrid"></div>
        </div>
    </section>

    <!-- ===== VIDEOS ===== -->
    <section id="videos" class="section videos">
        <div class="container">
            <h2 class="section-title" data-key="videos_title">Videos</h2>
            <div class="videos-grid" id="videosGrid"></div>
        </div>
    </section>

    <!-- ===== FOOTER ===== -->
    <footer>
        <div class="container">
            <p>&copy; 2026 Shikena Tattoo - <span data-key="footer_rights">All rights reserved</span></p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
