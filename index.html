<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shikena Tattoo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- ===== WHATSAPP FIJO ===== -->
    <a href="https://wa.me/34657382039" target="_blank" class="whatsapp-float">
        <i class="fab fa-whatsapp"></i>
    </a>

    <!-- ===== HEADER ===== -->
    <header>
        <div class="container header-container">
            <a href="index.html" class="logo">
                <div class="logo-wrapper">
                    <img src="images/Logo/logolunanegra.png" alt="Shikena Tattoo" class="logo-img logo-luna">
                    <img src="images/Logo/logoletrasnegras.png" alt="Shikena Tattoo" class="logo-img logo-letras">
                </div>
            </a>
            <div class="header-right">
                <!-- 3 IDIOMAS CON BARRAS -->
                <div class="language-selector">
                    <button class="lang-btn active" data-lang="en">EN</button>
                    <span class="lang-divider">|</span>
                    <button class="lang-btn" data-lang="de">DE</button>
                    <span class="lang-divider">|</span>
                    <button class="lang-btn" data-lang="es">ES</button>
                </div>
                <!-- MENÚ DESPLEGABLE -->
                <div class="dropdown">
                    <button class="dropdown-btn" id="dropdownBtn">
                        <span id="selectedCategory" data-key="gallery">Gallery</span>
                        <i class="fas fa-chevron-down"></i>
                    </button>
                    <div class="dropdown-content" id="dropdownContent">
                        <a href="galerias/blackwork.html" data-key="blackwork">Blackwork</a>
                        <a href="galerias/color.html" data-key="color">Color</a>
                        <a href="galerias/fine-line.html" data-key="fine_line">Fine Line</a>
                        <a href="galerias/cover-ups.html" data-key="cover_ups">Cover Ups</a>
                        <a href="videos/videos.html" style="border-top:1px solid rgba(255,255,255,0.1); margin-top:5px; padding-top:10px;" data-key="videos">Videos</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- ===== PORTADA ===== -->
    <section id="inicio" class="hero">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <div class="hero-images">
                <!-- FOTO 1 CON EMOJI -->
                <img src="images/Fotos%20tatuador/ChatGPT%20Image%206%20ago%202026%2C%2022_20_57.png" alt="Willy Tordera" class="hero-img" onclick="showEmoji()">
                
                <div class="hero-quote">
                    <span class="quote-text" data-key="hero_quote">Every tattoo tells a story</span>
                </div>
                
                <!-- FOTO 2 CON EMOJI -->
                <img src="images/Fotos%20tatuador/ChatGPT%20Image%206%20ago%202026%2C%2022_28_15.png" alt="Willy Tordera" class="hero-img" onclick="showEmoji()">
            </div>
        </div>
    </section>

    <!-- ===== FOOTER ===== -->
    <footer>
        <div class="container">
            <p>&copy; 2026 Shikena Tattoo - <span data-key="footer_rights">All rights reserved</span></p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
